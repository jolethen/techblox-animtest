name: Render Manim Animation and Deploy to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install System Dependencies (FFmpeg & Cairo)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev

      # 3. Set Up Python Environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Install Manim
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install manim

      # 5. Render Manim Script
      - name: Render Animation
        run: |
          mkdir -p public/assets
          manim -pqh scripts/catalyst_forge.py CatalystForgeStory --output_file catalyst_forge.mp4
          
          # Move the rendered MP4 to the public assets folder
          mv media/videos/catalyst_forge/1080p60/catalyst_forge.mp4 public/assets/

      # 6. Copy HTML/Site Files to Public Folder
      - name: Prepare Web Assets
        run: |
          # Copy website files (like index.html) into the public deployment directory
          cp index.html public/ 2>/dev/null || echo "No index.html found at root, skipping."

      # 7. Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 8. Upload Artifact for Deployment
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      # 9. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
